[project]
name = "mcp-security-suite"
version = "0.1.0"
description = "Reusable, CI-gated security suite for MCP servers: repo scanners plus a protocol-level fuzz harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ross Shelton" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
scanners = ["bandit>=1.7", "pip-audit>=2.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-security-suite = "mcp_security_suite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_security_suite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
